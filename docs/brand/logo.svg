<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">toy-raytracer</title>
  <desc id="desc">A shaded sphere rests on a plane and casts a long soft shadow to the right.</desc>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2c2a3d"/>
      <stop offset="1" stop-color="#191926"/>
    </linearGradient>
    <radialGradient id="ivory" cx="0.3" cy="0.24" r="0.9">
      <stop offset="0" stop-color="#fdf3dd"/>
      <stop offset="0.35" stop-color="#e3c9a4"/>
      <stop offset="0.68" stop-color="#9c7f7e"/>
      <stop offset="0.9" stop-color="#4f3f52"/>
      <stop offset="1" stop-color="#37304a"/>
    </radialGradient>
    <linearGradient id="horizon" gradientUnits="userSpaceOnUse" x1="26" y1="0" x2="188" y2="0">
      <stop offset="0" stop-color="#a3a4b8" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#a3a4b8" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#a3a4b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a3a4b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.4" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0e0e16" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#0e0e16" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0e0e16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="160" rx="22" fill="url(#dusk)"/>

  <line x1="26" y1="104.5" x2="188" y2="104.5" stroke="url(#horizon)" stroke-width="2"/>

  <ellipse cx="124" cy="107" rx="48" ry="11" fill="url(#shadow)"/>
  <circle cx="92" cy="70" r="34" fill="url(#ivory)"/>
  <ellipse cx="76" cy="52" rx="9" ry="6" fill="#fff6e4" opacity="0.75" transform="rotate(-18 76 52)"/>
  <path d="M62 84 A34 34 0 0 0 90 103" fill="none" stroke="#f2b880" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <ellipse cx="94" cy="105" rx="12" ry="3.6" fill="#141420" opacity="0.7"/>

  <text x="198" y="97" font-size="41" font-weight="600" letter-spacing="-0.8" fill="#ececf2">toy-raytracer</text>
