     aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">toy-raytracer</title>
  <desc id="desc">Three overlapping orbs in coral, steel and translucent cyan, with the wordmark toy-raytracer on the right.</desc>
  <defs>
