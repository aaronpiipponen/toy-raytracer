<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="t d">
  <title id="t">toy-raytracer</title>
  <desc id="d">A camera eye on the left sends a ray that strikes a lit sphere, with the product name written to the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="0.55" stop-color="#13243a"/>
      <stop offset="1" stop-color="#0a1a2b"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#ffd9a3"/>
      <stop offset="0.42" stop-color="#f59e42"/>
      <stop offset="0.82" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#6d1f05"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe2b8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffcf8a"/>
      <stop offset="1" stop-color="#ff9d3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9d3d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff9d3d" stop-opacity="0"/>
    </radialGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffcf8a"/>
    </marker>
  </defs>

  <rect width="640" height="160" rx="20" fill="url(#bg)"/>

  <circle cx="112" cy="80" r="62" fill="url(#glow)"/>

  <!-- camera eye -->
  <circle cx="42" cy="80" r="15" fill="none" stroke="#9fb8d8" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="42" cy="80" r="7" fill="#eaf3ff"/>
  <circle cx="42" cy="80" r="3" fill="#13243a"/>

  <!-- ray -->
  <line x1="58" y1="80" x2="84" y2="80" stroke="url(#ray)" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>

  <!-- hit sphere -->
  <circle cx="112" cy="80" r="27" fill="url(#sphere)"/>
  <ellipse cx="102" cy="68" rx="8" ry="5.5" fill="#fff6e4" opacity="0.75" transform="rotate(-24 102 68)"/>
  <ellipse cx="122" cy="92" rx="10" ry="4" fill="#ffb066" opacity="0.28" transform="rotate(-24 122 92)"/>

  <text x="180" y="93" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="600" letter-spacing="-0.4" fill="#f3ece2">toy-raytracer</text>
</svg>
